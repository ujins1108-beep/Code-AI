<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>CODE AI</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="left">

            <img src="./assets/CODEAI.png" class="title"/>

            <div class="aiselectbox">
                <h1 class="aiselecttext">AI 선택</h1>
            
                <select class="aiselect">
                    <option value="gemini">Gemini</option>
                    <option value="groq">Groq</option>
                </select>
            </div>

            <div class="apikeyinputbox">
                <h1 class="apikeytext">API 키 선택</h1>
            
                <input class="apikeyinput"/>
            </div>

            <div class="syspromptbox">
                <h1 class="sysprompttext">시스템 프롬프트</h1>

                <input class="syspromptinput" />
            </div>
        </div>

        <div class="right">

            <div class="objlist">
            </div>

            <div class="inputcontainer">
                <textarea class="input"></textarea>
                <div class="sendbtn">
                    <img class="sendimg" src="./assets/화살표.png"/>
                </div>
            </div>
        </div>

        <img onclick="window.open('https://github.com/ujins1108-beep')" class="logo" src="./XMFL로고.png" />
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </body>
</html>
